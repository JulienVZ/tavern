#
# One pull request per week and per ecosystem: every update of an ecosystem,
# whatever its size, lands in a single group.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # svelte-check supports TypeScript 5 and 6 only. Remove this entry when
      # its peer dependency range accepts the next major version.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # Every action is pinned to a full commit SHA, with its version in a
  # comment (`uses: owner/name@<sha> # vX.Y.Z`): Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns: ["*"]
