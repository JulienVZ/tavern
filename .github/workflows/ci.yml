# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug information in CI builds: it is not used there, and with it the
  # workspace (Tauri, the test binaries, a release build) outgrows the
  # runner's disk, which makes the linker crash.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tavern
          POSTGRES_PASSWORD: tavern
          POSTGRES_DB: tavern
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username tavern"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      # The toolchain version comes from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # `tauri::generate_context!` needs the frontend directory to exist.
      - name: Create placeholder frontend directory
        run: mkdir -p apps/desktop/ui/dist
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      # deny.toml ignores RUSTSEC-2026-0387 on the grounds that no crypto-bigint
      # code is linked (docs/adr/0011). This keeps that claim true.
      - name: crypto-bigint is not linked
        run: |
          CARGO_PROFILE_RELEASE_STRIP=none cargo build --release --locked \
            --package tavern-crypto --example argon2_memory
          count=$(nm target/release/examples/argon2_memory | grep -c crypto_bigint || true)
          echo "crypto_bigint symbols: $count"
          test "$count" -eq 0
      - name: Free disk space
        run: |
          df -h / | tail -n 1
          rm -rf target/release
      - name: Integration and end-to-end tests (PostgreSQL)
        run: cargo test --package tavern-server --package tavern-e2e-tests --locked -- --ignored
        env:
          TAVERN_TEST_DATABASE_URL: postgres://tavern:tavern@localhost:5432/tavern

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  ui:
    name: UI (check, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter tavern-ui check
      - run: pnpm --filter tavern-ui test
      - run: pnpm --filter tavern-ui build

  desktop:
    name: Desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # While the repository is private, pull requests build on Linux only
        # and the three systems are built on pushes to main, to save Actions
        # minutes. When the repository becomes public, build all three on pull
        # requests too (see CONTRIBUTING.md).
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Compiles the frontend and the application; installers are built by the
      # release workflow only.
      - run: pnpm tauri build --debug --no-bundle

  docker:
    name: Server image and deployment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          # Loaded under the name the compose file expects, so that the steps
          # below run this image instead of building it again.
          load: true
          tags: tavern-server:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prepare a local deployment (init.sh --dev)
        working-directory: deploy
        run: |
          ./scripts/init.sh --dev
          docker compose config --quiet
          # Running it again must change nothing.
          cp .env .env.first
          ./scripts/init.sh --dev
          diff .env.first .env
      # Rate limiting trusts the X-Forwarded-For entry added by Caddy. That is
      # sound only if nothing else can reach the server.
      - name: The server is reachable through Caddy only
        working-directory: deploy
        run: |
          # The production file alone (init.sh --dev enables the development
          # override through COMPOSE_FILE, so it is named explicitly here).
          production="docker compose -f docker-compose.yml"
          published=$($production config --format json | jq '.services.server.ports // [] | length')
          echo "ports published by the server service: $published"
          test "$published" -eq 0
          $production config --format json \
            | jq -e '.services.server.environment.TAVERN_TRUST_FORWARDED_FOR == "true"'
          # With the development override the server is reached directly, on
          # the loopback interface only, and must not trust forwarded headers.
          docker compose config --format json \
            | jq -e '.services.server.environment.TAVERN_TRUST_FORWARDED_FOR == "false"'
          docker compose config --format json \
            | jq -e '[.services.server.ports[].host_ip] | all(. == "127.0.0.1")'
      - name: Start the stack and query it through Caddy
        working-directory: deploy
        run: |
          docker compose up -d --wait --wait-timeout 120
          docker compose ps
          for attempt in $(seq 1 20); do
            if curl --silent --insecure --fail https://localhost/health; then break; fi
            sleep 3
          done
          echo
          curl --silent --insecure --fail https://localhost/health | jq -e '.status == "ok"'
          curl --silent --insecure --fail https://localhost/version | jq -e '.mls_external_sender_key | length > 0'
          # The development override publishes the server on the loopback interface.
          curl --silent --fail http://localhost:8080/version | jq -e '.rest.minor >= 1'
      - name: Create the administrator invitation, back up and restore
        working-directory: deploy
        run: |
          ./scripts/create-admin.sh | tee invite.txt
          grep -Eq '^ +[0-9A-Z]{4}(-[0-9A-Z]{2,4}){6}$' invite.txt
          ./scripts/backup.sh
          ./scripts/restore.sh --yes "$(ls backups/*.tar.gz | tail -n 1)"
          sleep 5
          curl --silent --insecure --fail --retry 10 --retry-delay 3 --retry-all-errors \
            https://localhost/health | jq -e '.status == "ok"'
      - name: Show logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose logs --tail 80
