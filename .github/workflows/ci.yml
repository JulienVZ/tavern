# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

# Every push to `main` and every pull request runs all the checks, and builds
# the desktop client on Linux, Windows and macOS. A change that touches
# documentation only runs nothing. To run it again by hand:
#   gh workflow run ci.yml --ref main
on:
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      # Read by the schema test.
      - "docs/database-schema.md"
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      # Read by the schema test.
      - "docs/database-schema.md"
  workflow_dispatch:

concurrency:
  # Per event: a push must not cancel an on-demand run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug information in CI builds: it is not used there, and with it the
  # workspace (Tauri, the test binaries, a release build) outgrows the
  # runner's disk, which makes the linker crash.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tavern
          POSTGRES_PASSWORD: tavern
          POSTGRES_DB: tavern_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username tavern"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      # The toolchain version comes from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `tauri::generate_context!` needs the frontend directory to exist.
      - name: Create placeholder frontend directory
        run: mkdir -p apps/desktop/ui/dist
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      # openmls_memory_storage is for tests only (docs/adr/0019). It is in the
      # graph through openmls_rust_crypto, which also re-exports it, so the
      # graph test of crates/crypto/tests is not enough: nothing of it may be
      # linked into the server. The crypto tests, which use it, show that the
      # search does find its symbols. Every binary searched must exist and
      # have symbols of its own: a search in nothing finds nothing.
      - name: No test-only MLS storage in the server binary
        run: |
          tests=$(cargo test --locked --package tavern-crypto --lib --no-run --message-format=json \
            | jq -r 'select(.executable != null) | .executable' | head -n 1)
          test -f "$tests"
          nm "$tests" > "$RUNNER_TEMP/crypto-tests.nm"
          found=$(grep -c openmls_memory_storage "$RUNNER_TEMP/crypto-tests.nm" || true)
          echo "openmls_memory_storage symbols in the crypto tests: $found"
          test "$found" -gt 0
          binary=target/debug/tavern-server
          test -f "$binary"
          nm "$binary" > "$RUNNER_TEMP/server.nm"
          own=$(grep -c tavern_server "$RUNNER_TEMP/server.nm" || true)
          echo "tavern_server symbols in the server: $own"
          test "$own" -gt 0
          count=$(grep -c openmls_memory_storage "$RUNNER_TEMP/server.nm" || true)
          echo "openmls_memory_storage symbols in the server: $count"
          test "$count" -eq 0
      # OpenSSL is allowed in one place: inside SQLCipher, the client's local
      # store (docs/adr/0018). deny.toml limits who may depend on it; this
      # keeps the server free of it, and of SQLite. The image is checked too.
      - name: The server depends on no OpenSSL and no SQLite
        run: |
          found=$(cargo tree --locked --package tavern-server --target all --edges normal,build --prefix none \
            | grep -E '^(openssl|openssl-sys|openssl-src|native-tls|libsqlite3-sys|rusqlite|sqlcipher-src) ' || true)
          if [ -n "$found" ]; then echo "$found" | sort -u; exit 1; fi
      # deny.toml ignores RUSTSEC-2026-0387 on the grounds that no crypto-bigint
      # code is linked (docs/adr/0011). This keeps that claim true.
      - name: crypto-bigint is not linked
        run: |
          CARGO_PROFILE_RELEASE_STRIP=none cargo build --release --locked \
            --package tavern-crypto --example argon2_memory
          binary=target/release/examples/argon2_memory
          test -f "$binary"
          nm "$binary" > "$RUNNER_TEMP/argon2_memory.nm"
          own=$(grep -c argon2_memory "$RUNNER_TEMP/argon2_memory.nm" || true)
          echo "argon2_memory symbols in the example: $own"
          test "$own" -gt 0
          count=$(grep -c crypto_bigint "$RUNNER_TEMP/argon2_memory.nm" || true)
          echo "crypto_bigint symbols: $count"
          test "$count" -eq 0
      # deny.toml ignores RUSTSEC-2026-0543 (chrono, unmaintained) on the
      # grounds that zxcvbn depends on chrono for wasm32 only, a target Tavern
      # does not ship. This keeps that claim true for every shipped target,
      # with every feature on, as cargo deny reads the graph (deny.toml,
      # [graph]). Witnesses: chrono is found under wasm32, and zxcvbn under
      # each shipped target. Once zxcvbn drops chrono, the first witness
      # fails: remove this step and the deny.toml entry.
      - name: chrono is not built for any shipped target
        run: |
          deps() { cargo tree --locked --workspace --all-features --target "$1" --invert "$2" --prefix none; }
          deps wasm32-unknown-unknown chrono > "$RUNNER_TEMP/chrono-wasm32.tree"
          grep -q '^chrono ' "$RUNNER_TEMP/chrono-wasm32.tree"
          echo "wasm32: chrono found (witness)"
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
            x86_64-pc-windows-msvc aarch64-pc-windows-msvc \
            x86_64-apple-darwin aarch64-apple-darwin; do
            deps "$target" zxcvbn > "$RUNNER_TEMP/zxcvbn.tree"
            grep -q '^zxcvbn ' "$RUNNER_TEMP/zxcvbn.tree"
            deps "$target" chrono > "$RUNNER_TEMP/chrono.tree"
            if grep -q '^chrono ' "$RUNNER_TEMP/chrono.tree"; then
              echo "$target builds chrono:"; cat "$RUNNER_TEMP/chrono.tree"; exit 1
            fi
            echo "$target: zxcvbn found (witness), chrono absent"
          done
      - name: Free disk space
        run: |
          df -h / | tail -n 1
          rm -rf target/release
      - name: Integration and end-to-end tests (PostgreSQL)
        run: cargo test --package tavern-server --package tavern-e2e-tests --locked -- --ignored
        env:
          TAVERN_TEST_DATABASE_URL: postgres://tavern:tavern@localhost:5432/tavern_test

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --all-features

  ui:
    name: UI (check, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter tavern-ui check
      - run: pnpm --filter tavern-ui test
      - run: pnpm --filter tavern-ui build

  desktop:
    name: Desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Compiles the frontend and the application; installers are built by the
      # release workflow only.
      - run: pnpm tauri build --debug --no-bundle
      # SQLCipher must use the OpenSSL compiled into the client, never the
      # system's (docs/adr/0018): the binary must not link libssl or
      # libcrypto, and must carry the version that openssl-src compiles.
      - name: The client uses its own OpenSSL, not the system's
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: |
          binary=target/debug/tavern-desktop
          test -f "$binary"
          readelf --dynamic "$binary" | grep NEEDED
          if readelf --dynamic "$binary" | grep -E 'lib(ssl|crypto)\.so'; then
            echo "the client links the system's OpenSSL"; exit 1
          fi
          vendored=$(grep -A1 '^name = "openssl-src"$' Cargo.lock | sed -n 's/^version = ".*+\(.*\)"$/\1/p')
          echo "OpenSSL compiled into the client: $vendored"
          test -n "$vendored"
          grep -aq "OpenSSL $vendored" "$binary"
          echo "Loaded at run time (informative):"
          ldd "$binary" | grep -E 'lib(ssl|crypto)' || echo "  no libssl or libcrypto"
          # And no test-only MLS storage (docs/adr/0019), searched in symbols
          # that are there (the client's own).
          nm "$binary" > "$RUNNER_TEMP/client.nm"
          own=$(grep -c tavern_desktop "$RUNNER_TEMP/client.nm" || true)
          echo "tavern_desktop symbols in the client: $own"
          test "$own" -gt 0
          count=$(grep -c openmls_memory_storage "$RUNNER_TEMP/client.nm" || true)
          echo "openmls_memory_storage symbols in the client: $count"
          test "$count" -eq 0
      # The local store's tests (docs/adr/0018) on the systems that the Rust
      # job does not cover: CommonCrypto on macOS, OpenSSL on Windows, the
      # same file format everywhere.
      - name: Local store (SQLCipher) on this system
        if: runner.os != 'Linux'
        working-directory: ${{ github.workspace }}
        run: cargo test --locked --package tavern-client-core
      # The Linux run of these tests is in the Rust job. macOS is where the
      # allocator kept the 128 MiB (docs/adr/0015); Windows is checked too.
      - name: Argon2id working memory is returned to the system
        if: runner.os != 'Linux'
        working-directory: ${{ github.workspace }}
        run: |
          cargo test --locked --package tavern-argon2-memory
          cargo test --locked --package tavern-crypto --test argon2_memory_release -- --nocapture

  # The only crate with `unsafe` code of our own, run under Miri for the
  # Linux and macOS implementations of `mmap` (docs/adr/0015).
  miri:
    name: Miri (argon2-memory)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the nightly toolchain with Miri
        run: |
          rustup toolchain install nightly --profile minimal --component miri,rust-src
          rustup target add --toolchain nightly aarch64-apple-darwin
      - name: Miri (Linux)
        run: cargo +nightly miri test --locked --package tavern-argon2-memory
      - name: Miri (macOS target)
        run: cargo +nightly miri test --locked --package tavern-argon2-memory --target aarch64-apple-darwin

  docker:
    name: Server image and deployment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # No build record artefact (.dockerbuild) in the run's artefacts.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          # Loaded under the name the compose file expects, so that the steps
          # below run this image instead of building it again.
          load: true
          tags: tavern-server:local
          build-args: TAVERN_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The server binary contains no OpenSSL
        run: |
          container=$(docker create tavern-server:local)
          docker cp "$container:/usr/local/bin/tavern-server" "$RUNNER_TEMP/tavern-server"
          docker rm "$container"
          readelf --dynamic "$RUNNER_TEMP/tavern-server" | grep NEEDED
          if readelf --dynamic "$RUNNER_TEMP/tavern-server" | grep -E 'lib(ssl|crypto)\.so'; then exit 1; fi
          # A statically linked OpenSSL carries its version text.
          if grep -aq 'OpenSSL 3\.' "$RUNNER_TEMP/tavern-server"; then exit 1; fi
      - name: Prepare a local deployment (init.sh --dev)
        working-directory: deploy
        run: |
          ./scripts/init.sh --dev
          docker compose config --quiet
          # Running it again must change nothing.
          cp .env .env.first
          ./scripts/init.sh --dev
          diff .env.first .env
      # Rate limiting trusts the X-Forwarded-For entry added by Caddy. That is
      # sound only if nothing else can reach the server.
      - name: The server is reachable through Caddy only
        working-directory: deploy
        run: |
          # The production file alone (init.sh --dev enables the development
          # override through COMPOSE_FILE, so it is named explicitly here).
          production="docker compose -f docker-compose.yml"
          published=$($production config --format json | jq '.services.server.ports // [] | length')
          echo "ports published by the server service: $published"
          test "$published" -eq 0
          $production config --format json \
            | jq -e '.services.server.environment.TAVERN_TRUST_FORWARDED_FOR == "true"'
          # With the development override the server is reached directly, on
          # the loopback interface only, and must not trust forwarded headers.
          docker compose config --format json \
            | jq -e '.services.server.environment.TAVERN_TRUST_FORWARDED_FOR == "false"'
          docker compose config --format json \
            | jq -e '[.services.server.ports[].host_ip] | all(. == "127.0.0.1")'
      - name: Refuse to create an invitation while the server is stopped
        working-directory: deploy
        run: |
          # create-admin.sh runs in the running server; it never builds or
          # starts anything itself.
          if ./scripts/create-admin.sh 2> refusal.txt; then exit 1; fi
          cat refusal.txt
          grep -q "the Tavern server is not running" refusal.txt
      - name: Start the stack and query it through Caddy
        working-directory: deploy
        run: |
          docker compose up -d --wait --wait-timeout 120
          docker compose ps
          for attempt in $(seq 1 20); do
            if curl --silent --insecure --fail https://localhost/health; then break; fi
            sleep 3
          done
          echo
          curl --silent --insecure --fail https://localhost/health | jq -e '.status == "ok"'
          curl --silent --insecure --fail https://localhost/version | jq -e '.mls_external_sender_key | length > 0'
          # The development override publishes the server on the loopback interface.
          curl --silent --fail http://localhost:8080/version | jq -e '.rest.minor >= 1'
          # The running server says which commit it was built from.
          curl --silent --fail http://localhost:8080/version | jq -e --arg sha "$GITHUB_SHA" '.commit == $sha'
      - name: Create the administrator invitation, back up and restore
        working-directory: deploy
        run: |
          ./scripts/create-admin.sh | tee invite.txt
          grep -Eq '^ +[0-9A-Z]{4}(-[0-9A-Z]{2,4}){6}$' invite.txt
          ./scripts/backup.sh
          ./scripts/restore.sh --yes "$(ls backups/*.tar.gz | tail -n 1)"
          sleep 5
          curl --silent --insecure --fail --retry 10 --retry-delay 3 --retry-all-errors \
            https://localhost/health | jq -e '.status == "ok"'
      - name: Show logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose logs --tail 80
