#
# Reference deployment of a Tavern instance.
#
#   ./scripts/init.sh        # creates .env, Caddyfile and livekit.yaml, generates secrets
#   docker compose up -d
#
# Every setting comes from .env (see .env.example and docs/configuration.md).

name: tavern

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tavern}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run ./scripts/init.sh}
      POSTGRES_DB: ${POSTGRES_DB:-tavern}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username \"$$POSTGRES_USER\" --dbname \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - internal

  server:
    image: ${TAVERN_SERVER_IMAGE:-tavern-server:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TAVERN_LISTEN_ADDR: 0.0.0.0:8080
      TAVERN_DATABASE_URL: postgres://${POSTGRES_USER:-tavern}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tavern}
      TAVERN_RUN_MIGRATIONS: ${TAVERN_RUN_MIGRATIONS:-true}
      TAVERN_LOG_LEVEL: ${TAVERN_LOG_LEVEL:-info}
      TAVERN_LOG_FORMAT: ${TAVERN_LOG_FORMAT:-text}
      TAVERN_SOURCE_URL: ${TAVERN_SOURCE_URL:-}
    healthcheck:
      test: ["CMD", "/usr/local/bin/tavern-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is not set - run ./scripts/init.sh}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is not set - run ./scripts/init.sh}"
      NODE_IP: ${LIVEKIT_NODE_IP:-}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # Media. The host ports must equal the ports in livekit.yaml, because
      # LiveKit advertises them to clients.
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:${LIVEKIT_RTC_TCP_PORT:-7881}/tcp"
      - "${LIVEKIT_RTC_UDP_PORT:-7882}:${LIVEKIT_RTC_UDP_PORT:-7882}/udp"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - server
      - livekit
    environment:
      TAVERN_DOMAIN: ${TAVERN_DOMAIN:?TAVERN_DOMAIN is not set - edit .env}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:?LIVEKIT_DOMAIN is not set - edit .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${CADDY_HTTP_PORT:-80}:80/tcp"
      - "${CADDY_HTTPS_PORT:-443}:443/tcp"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    networks:
      - internal

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  internal:
