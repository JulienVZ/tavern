# SPDX-License-Identifier: AGPL-3.0-or-later

[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/argon2-memory",
    "crates/crypto",
    "crates/server",
    "crates/client-core",
    "crates/media",
    "crates/e2e-tests",
    "apps/desktop/src-tauri",
]
# Built only by the fuzzing workflow, with a nightly toolchain; and a
# stand-in that is never built (see [patch.crates-io] below).
exclude = ["crates/protocol/fuzz", "third_party/sqlx-sqlite-unused"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"
repository = "https://github.com/JulienVZ/tavern"
publish = false

[workspace.dependencies]
# Internal crates
tavern-protocol = { path = "crates/protocol" }
tavern-crypto = { path = "crates/crypto" }
tavern-argon2-memory = { path = "crates/argon2-memory" }
tavern-client-core = { path = "crates/client-core" }

# Shared third-party crates
anyhow = "1.0"

# Cryptography. These follow the RustCrypto generation that opaque-ke 4 is
# built on (digest 0.10); see docs/adr/0011-account-identity-and-primitives.md.
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
data-encoding = "2.11"
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
hkdf = "0.12"
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255", "argon2", "std"] }
proptest = "1.12"
rand = "0.8"
sha2 = "0.10"
subtle = "2.6"
unicode-normalization = "0.1.26"
zeroize = { version = "1.9", features = ["derive"] }
# MLS (docs/adr/0019). Pinned: a minor OpenMLS upgrade can change the storage
# format and needs the compatibility test of ADR 0019, section 13.
openmls = "=0.9.2"
openmls_traits = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
# Tests only (CI checks that no production code uses it).
openmls_memory_storage = "=0.6.0"

axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "matched-path", "tokio", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
prost = "0.14.6"
qrcode = { version = "0.14.1", default-features = false }
prost-build = "0.14.6"
protox = "0.10.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "uuid"] }
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }
governor = "0.10.4"
keyring = "4.2.0"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
zxcvbn = { version = "3.1.1", default-features = false }
# The client's local store: SQLCipher through rusqlite (docs/adr/0018). The
# crypto provider is chosen per system in crates/client-core/Cargo.toml.
rusqlite = { version = "0.43", default-features = false }
tempfile = "3.27"
thiserror = "2.0"
totp-rs = { version = "6.0.0", features = ["otpauth"] }
utoipa = { version = "6.0.0", features = ["uuid"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.29", features = ["serde", "v4"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util"] }
tower-http = { version = "0.7.1", features = ["timeout", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5"

# sqlx 0.9.0 keeps an optional dependency on its SQLite driver, which pins
# libsqlite3-sys below 0.38; Cargo resolves it even though it is never
# enabled, and only one crate may link `sqlite3`. The stand-in frees that slot
# for the client's SQLCipher. Never built. See its README before upgrading sqlx.
[patch.crates-io]
sqlx-sqlite = { path = "third_party/sqlx-sqlite-unused" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "warn"
print_stderr = "warn"

# Debug information is what makes target/ large (20 GB for this workspace with
# the defaults). Our own crates keep line numbers for backtraces; dependencies
# carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Key stretching and curve arithmetic are unusably slow without optimisation:
# a single Argon2id run at the production parameters takes seconds. These
# packages are optimised in development and test builds too.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
