# SPDX-License-Identifier: AGPL-3.0-or-later

[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/crypto",
    "crates/server",
    "crates/client-core",
    "crates/media",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"
repository = "https://github.com/JulienVZ/tavern"
publish = false

[workspace.dependencies]
# Internal crates
tavern-protocol = { path = "crates/protocol" }
tavern-client-core = { path = "crates/client-core" }

# Shared third-party crates
anyhow = "1.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "tokio"] }
prost = "0.14.6"
prost-build = "0.14.6"
protox = "0.10.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros"] }
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
