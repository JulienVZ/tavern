[package]
name = "tavern-client-core"
description = "Tavern client logic without UI: networking, MLS, local store, media sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tavern-crypto.workspace = true
tavern-protocol.workspace = true

data-encoding.workspace = true
futures-util.workspace = true
keyring.workspace = true
prost.workspace = true
qrcode.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
openmls_traits.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true
zxcvbn.workspace = true

# The local store: SQLCipher 4 (docs/adr/0018). Its crypto comes from the
# system's CommonCrypto on macOS, and elsewhere from OpenSSL compiled from
# source and linked statically, never the system's libcrypto (checked in CI).
[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile.workspace = true
[lints]
workspace = true
