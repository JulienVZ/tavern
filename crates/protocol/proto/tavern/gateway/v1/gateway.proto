// Gateway protocol, major version 1.
//
// Specification: docs/protocol.md. This file holds the session and account
// messages of milestone M1; messaging payloads arrive with M2.
//
// Compatibility rules: additive changes only, never reuse or renumber a field
// or an enum value, mark removed ones as `reserved`.

syntax = "proto3";

package tavern.gateway.v1;

// Client to server. One message per binary WebSocket frame.
message ClientFrame {
  // Chosen by the client, unique per connection, never 0. Echoed in the response.
  uint64 request_id = 1;

  oneof payload {
    Hello hello = 10;
    Heartbeat heartbeat = 11;
    AckDeviceList ack_device_list = 12;
    AckSecurityNotices ack_security_notices = 13;

    // M2: a conversation's sequence (ADR 0019). Since minor 5.
    SendMessage send_message = 20;
    SubmitCommit submit_commit = 21;
    FetchMessages fetch_messages = 22;
    AckMessages ack_messages = 23;
    AckWelcome ack_welcome = 24;
    FetchGroupInfo fetch_group_info = 25;
    ReportUnjoinable report_unjoinable = 26;  // Since minor 8.
  }
}

// Server to client.
message ServerFrame {
  // Copy of the request id for a response; 0 for an event.
  uint64 request_id = 1;

  oneof payload {
    Error error = 9;
    Ready ready = 10;
    HeartbeatAck heartbeat_ack = 11;
    Ack ack = 12;

    // M2 responses. Since minor 5.
    SendMessageAck send_message_ack = 20;
    CommitAck commit_ack = 21;
    MessageBatch message_batch = 22;
    GroupInfo group_info = 25;

    // Events (request_id = 0).
    SessionRevoked session_revoked = 15;
    DeviceListChanged device_list_changed = 16;
    SecurityNotice security_notice = 17;

    // M2 events (field numbers as in docs/protocol.md, section 3).
    MessageEvent message_event = 40;  // Since minor 5.
    CommitEvent commit_event = 41;  // Since minor 5.
    ProposalEvent proposal_event = 42;  // Since minor 5.
    WelcomeEvent welcome_event = 43;  // Since minor 5.
    ConversationCreated conversation_created = 44;  // Since minor 4.
    FriendshipChanged friendship_changed = 45;  // Since minor 3.
    KeyPackagesLow key_packages_low = 48;  // Since minor 2.
    UserDevicesChanged user_devices_changed = 49;  // Since minor 3.
    JoinConversation join_conversation = 50;  // Since minor 6.
    RecreateConversation recreate_conversation = 51;  // Since minor 8.
  }
}

// First frame of every connection. Must arrive within the Hello deadline.
message Hello {
  bytes session_token = 1;
  uint32 protocol_minor = 2;
  string client_version = 3;
  string client_platform = 4;
}

message Ready {
  bytes user_id = 1;
  bytes device_id = 2;
  uint32 protocol_minor = 3;
  uint64 server_time_ms = 4;
  Limits limits = 5;
  // Current Ed25519 public key of the instance's MLS external sender.
  bytes mls_external_sender_key = 6;
  // One-time KeyPackages of this device the server can still serve (filled
  // since minor 2; 0 before).
  uint32 key_packages_remaining = 7;
  // Devices enrolled on the account since this device last acknowledged the
  // device list. The client shows them to the user, with a way to revoke
  // them, then sends AckDeviceList.
  repeated DeviceSummary new_devices = 8;
  // Security notices of the account that this device has not acknowledged,
  // oldest first. The client shows them until the user dismisses them, then
  // sends AckSecurityNotices. Since minor 1.
  repeated SecurityNotice security_notices = 9;
  // The instance generation: raised each time the instance is restored from
  // a backup. A client that sees it change recreates the groups of its
  // conversations (ADR 0019, sections 15 and 17). Since minor 7.
  uint64 instance_generation = 10;
}

message DeviceSummary {
  bytes device_id = 1;
  Platform platform = 2;
  uint64 created_at_ms = 3;
}

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_WINDOWS = 1;
  PLATFORM_MACOS = 2;
  PLATFORM_LINUX = 3;
}

// The user has seen the device list as of now.
message AckDeviceList {}

// Generic success response.
message Ack {}

// The session of this device ended. The server closes the connection next.
message SessionRevoked {
  RevocationReason reason = 1;
}

enum RevocationReason {
  REVOCATION_REASON_UNSPECIFIED = 0;
  // The user logged out or revoked this device.
  REVOCATION_REASON_REVOKED = 1;
  // The password was changed or recovered from another device.
  REVOCATION_REASON_CREDENTIALS_CHANGED = 2;
  // The account was disabled by an administrator.
  REVOCATION_REASON_ACCOUNT_DISABLED = 3;
  // A newer connection of the same device replaced this one.
  REVOCATION_REASON_REPLACED = 4;
}

// A device of the account was enrolled or revoked. Sent to every other
// connected device of the account. For an enrolment the client notifies the
// user and offers to revoke the new device.
message DeviceListChanged {
  bytes device_id = 1;
  bool added = 2;
}

// A claim left this device fewer than 10 one-time KeyPackages on the
// server: the device uploads more. Sent to the device if it is connected; a
// device that is not uploads at its next connection anyway. Since minor 2.
message KeyPackagesLow {
  uint32 remaining = 1;
}

// A conversation of this user was created (ADR 0019, section 4). Sent to the
// connected devices of its members; the others read GET /v1/conversations.
// It has no MLS group yet: the creating device builds it, and any active
// device of a member may if that one does not. Since minor 4.
message ConversationCreated {
  bytes conversation_id = 1;
  ConversationKind kind = 2;
  repeated bytes member_user_ids = 3;
}

// An active device of a member is not in the conversation's group, or the
// server asked to remove it (ADR 0019, sections 4 and 15): it joins by
// external commit, from the GroupInfo. Sent after each commit the server
// merges, to such devices if they are connected, in a DM open to writing
// only; the others read `joined` in GET /v1/conversations. Since minor 6.
message JoinConversation {
  bytes conversation_id = 1;
}

// A conversation's group has no member left that can commit: every leaf is
// being removed by the server (away, revoked, or a leaf never updated near
// the end of its lifetime). It must be recreated (ADR 0019, sections 3 and
// 17): any active device of a participant builds the first commit of the
// next generation; the first one wins, the others are told STALE_EPOCH.
// Until then the old group takes nothing: GROUP_RECREATION_REQUIRED. Sent
// to the connected devices of both participants; the others read
// `needs_recreation` in GET /v1/conversations. Since minor 8.
message RecreateConversation {
  bytes conversation_id = 1;
}

enum ConversationKind {
  CONVERSATION_KIND_UNSPECIFIED = 0;
  CONVERSATION_KIND_DM = 1;
  // Private groups and channels: M3 and M4.
}

// The relation of this user with another one changed (ADR 0020). Sent to
// the connected devices of both users, each with its own view: a request
// sent to a user who blocks its sender is REQUEST_SENT for the sender and
// nothing for the other; BLOCKED goes to the blocker's devices only, and the
// blocked user sees NONE, as after an unfriending. Devices that are not
// connected read GET /v1/friends. Since minor 3.
message FriendshipChanged {
  bytes user_id = 1;
  FriendshipState state = 2;
}

enum FriendshipState {
  FRIENDSHIP_STATE_NONE = 0;
  FRIENDSHIP_STATE_REQUEST_SENT = 1;
  FRIENDSHIP_STATE_REQUEST_RECEIVED = 2;
  FRIENDSHIP_STATE_FRIENDS = 3;
  FRIENDSHIP_STATE_BLOCKED = 4;
}

// A friend enrolled or revoked a device. Sent to the connected devices of
// the user's friends, who show a notice in shared conversations when a
// device was added (ADR 0003). Since minor 3.
message UserDevicesChanged {
  bytes user_id = 1;
  bytes device_id = 2;
  bool added = 3;
}

// Something security-relevant happened to the account. Pushed to the
// connected devices as an event, and listed again in Ready for every device
// that has not acknowledged it. It carries a kind and a date, never text.
message SecurityNotice {
  SecurityNoticeKind kind = 1;
  // Identifies the notice in AckSecurityNotices. Since minor 1.
  bytes notice_id = 2;
  // Since minor 1.
  uint64 created_at_ms = 3;
  // INSTANCE_RESTORED and INSTANCE_RESTORED_ADMIN only: when the restored
  // backup was taken, 0 if the server does not know. Since minor 7.
  uint64 backup_taken_at_ms = 4;
}

// A client shows a kind it does not know as a generic notice.
enum SecurityNoticeKind {
  SECURITY_NOTICE_KIND_UNSPECIFIED = 0;
  // An administrator disabled TOTP on this account.
  SECURITY_NOTICE_KIND_TOTP_DISABLED_BY_ADMIN = 1;
  // The password was changed. The other devices were signed out.
  SECURITY_NOTICE_KIND_PASSWORD_CHANGED = 2;
  // The account was recovered with the recovery key: new password, every
  // device signed out.
  SECURITY_NOTICE_KIND_ACCOUNT_RECOVERED = 3;
  // A device of the account was revoked.
  SECURITY_NOTICE_KIND_DEVICE_REVOKED = 4;
  // The recovery key was replaced; the previous one stopped working.
  SECURITY_NOTICE_KIND_RECOVERY_KEY_REPLACED = 5;
  // The instance was restored from a backup (backup_taken_at_ms): whatever
  // the user changed after it is undone, and every device was signed out.
  // Since minor 7.
  SECURITY_NOTICE_KIND_INSTANCE_RESTORED = 6;
  // The same restore, to an administrator (backup_taken_at_ms): what
  // administrators did after it is undone (accounts disabled since, roles,
  // TOTP disabled by an administrator), and every invitation still valid
  // was revoked. Since minor 7.
  SECURITY_NOTICE_KIND_INSTANCE_RESTORED_ADMIN = 7;
}

// The user dismissed these notices on this device. Unknown identifiers are
// ignored. At most 64 per frame. Since minor 1.
message AckSecurityNotices {
  repeated bytes notice_ids = 1;
}

message Limits {
  uint32 max_frame_bytes = 1;
  uint32 max_application_message_bytes = 2;
  uint64 max_upload_bytes = 3;
  uint32 heartbeat_interval_ms = 4;
}

message Heartbeat {}

message HeartbeatAck {
  uint64 server_time_ms = 1;
}

message Error {
  ErrorCode code = 1;
  // English, for logs. User interfaces localise from the code.
  string message = 2;
  // Set for RATE_LIMITED and UNAVAILABLE.
  uint32 retry_after_ms = 3;
  // Set for STALE_EPOCH when the server knows it: the group's current epoch.
  // Since minor 5.
  uint64 current_epoch = 4;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_FORBIDDEN = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_ALREADY_EXISTS = 5;
  ERROR_CODE_PAYLOAD_TOO_LARGE = 6;
  ERROR_CODE_RATE_LIMITED = 7;
  ERROR_CODE_UNSUPPORTED_VERSION = 8;
  ERROR_CODE_UNSUPPORTED_MESSAGE = 9;
  ERROR_CODE_INTERNAL = 10;
  ERROR_CODE_UNAVAILABLE = 11;

  // MLS and delivery (M2). Since minor 5.
  // 40 is reserved: a commit that loses its epoch gets STALE_EPOCH too.
  ERROR_CODE_STALE_EPOCH = 41;  // for a past epoch: apply what is new, then resend
  ERROR_CODE_REMOVAL_PENDING = 42;  // commit the server's pending removals first
  ERROR_CODE_INVALID_COMMIT = 43;  // fails validation against the group's public state
  ERROR_CODE_INVALID_KEY_PACKAGE = 44;
  ERROR_CODE_NOT_A_MEMBER = 45;  // not a device of the group, or not a participant
  ERROR_CODE_GROUP_INFO_REQUIRED = 46;
  // The conversation's group must be recreated first (a restored backup), or
  // the message is for a group that was recreated since (section 17). Since
  // minor 7.
  ERROR_CODE_GROUP_RECREATION_REQUIRED = 47;

  // Social (M2). Since minor 5.
  ERROR_CODE_BLOCKED = 60;  // the sender blocks the other user; never sent to the blocked one
  ERROR_CODE_NOT_FRIENDS = 61;  // a read-only DM: the users are not friends any more
}

// --- A conversation's sequence (ADR 0019, sections 4 to 7). Since minor 5. ---

// An MLS PrivateMessage carrying application content, encrypted for the
// group's current epoch.
message SendMessage {
  bytes conversation_id = 1;
  // UUID chosen by the sending device: a resend with the same one gets the
  // original acknowledgement, and is never stored nor delivered twice.
  bytes client_message_id = 2;
  bytes mls_message = 3;
}

message SendMessageAck {
  uint64 seq = 1;
  uint64 server_time_ms = 2;
}

// An MLS commit (PublicMessage) for the group's current epoch; exactly one
// commit is accepted per epoch. With epoch 0 and no group yet, the group's
// first commit, from any active device of a participant. With epoch 0 and a
// generation the conversation does not have yet, its recreation (since minor
// 7): the next generation, or any later one when the conversation must be
// recreated after a restore.
message SubmitCommit {
  bytes conversation_id = 1;
  uint64 epoch = 2;
  bytes mls_commit = 3;
  bytes mls_welcome = 4;      // present when the commit adds devices
  bytes mls_group_info = 5;   // required: the new epoch's GroupInfo, with its ratchet tree
  bool external = 6;          // an external commit: this device joins
}

message CommitAck {
  uint64 seq = 1;
  uint64 new_epoch = 2;
  uint64 server_time_ms = 3;
}

// The conversation's sequence after `after_seq`, in order.
message FetchMessages {
  bytes conversation_id = 1;
  uint64 after_seq = 2;
  uint32 limit = 3;           // at most 200; 0 means 200
}

message MessageBatch {
  repeated StoredMessage messages = 1;
  bool more = 2;
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_APPLICATION = 1;
  MESSAGE_KIND_COMMIT = 2;
  MESSAGE_KIND_PROPOSAL = 3;
}

message StoredMessage {
  bytes conversation_id = 1;
  uint64 seq = 2;
  uint64 epoch = 3;
  MessageKind kind = 4;
  bytes sender_device_id = 5; // empty for the server's own proposals
  uint64 server_time_ms = 6;
  bytes mls_message = 7;
}

// This device has durably processed the sequence up to `up_to_seq`.
message AckMessages {
  bytes conversation_id = 1;
  uint64 up_to_seq = 2;
}

// This device has joined, or refused, the group of a Welcome.
message AckWelcome { bytes welcome_id = 1; }

// The latest GroupInfo of a conversation's group, to join it by external
// commit.
message FetchGroupInfo { bytes conversation_id = 1; }

// This device has no usable state for a conversation's group, and cannot
// join it: a Welcome or an external commit refused (a leaf outlived its
// KeyPackage, or its resync failed), its store reset (ADR 0019, section 3).
// If it is a leaf of the group, the server asks to remove that leaf, its
// own and never another; then it asks for the removals due there, and
// checks whether any member can still commit; if none can, the group must
// be recreated (RecreateConversation). Answered with Ack; one accepted per
// device and conversation in any hour, the others RATE_LIMITED with no
// effect. Sent once, after a failed resync, never in a loop. Since minor 8.
message ReportUnjoinable { bytes conversation_id = 1; }

message GroupInfo {
  uint64 epoch = 1;
  bytes mls_group_info = 2;
}

// Each carries one StoredMessage of the sequence.
message MessageEvent  { StoredMessage message = 1; }
message CommitEvent   { StoredMessage message = 1; }
message ProposalEvent { StoredMessage message = 1; }  // the server's own Remove proposals

// A Welcome for this device. Sent again at each connection until
// acknowledged.
message WelcomeEvent {
  bytes welcome_id = 1;
  bytes conversation_id = 2;
  bytes mls_welcome = 3;
}
