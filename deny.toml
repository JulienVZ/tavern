#
# cargo-deny configuration. Run with `cargo deny check`.
# Policy: CLAUDE.md §10 and docs/adr/0007-agpl-license.md.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error (unmaintained) is a build-time dependency of the GTK 3
    # bindings that Tauri 2 uses on Linux. There is no upgrade until Tauri moves
    # off GTK 3. To be re-evaluated on every Tauri upgrade and at milestone M9.
    { id = "RUSTSEC-2024-0370", reason = "transitive build-time dependency of Tauri's GTK 3 stack on Linux" },
    # zvariant, zbus_names and zvariant_derive were merged into zbus 6 and are
    # flagged as no longer maintained as separate crates. They reach us on
    # Linux only, through keyring's Secret Service store (secret-service 5,
    # zbus 5). No vulnerability is reported. secret-service 6 (zbus 6) is in
    # release candidate; drop these three entries when keyring picks it up.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; Linux keychain dependency, awaiting keyring upgrade" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; Linux keychain dependency, awaiting keyring upgrade" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; Linux keychain dependency, awaiting keyring upgrade" },
    # crypto-bigint 0.5 (timing variability, fixed only in 0.7.6) comes from
    # elliptic-curve 0.13, a dependency of opaque-ke 4 and voprf 0.5. Tavern's
    # OPAQUE suite uses ristretto255 only, whose arithmetic is in
    # curve25519-dalek: no crypto-bigint arithmetic is linked into our
    # binaries. Verified with `nm` on an optimised build (0 symbols) and on the
    # unoptimised test binary (2 symbols, both generic helpers from `subtle`
    # and `core` that the compiler placed in that crate's unit; no arithmetic).
    # CI repeats the optimised check on every run (step "crypto-bigint is not
    # linked" in .github/workflows/ci.yml). Method and results:
    # docs/adr/0011-account-identity-and-primitives.md, "Known advisory".
    # Re-evaluate on every opaque-ke upgrade and at M9.
    { id = "RUSTSEC-2026-0387", reason = "affected code is not linked: ristretto255 arithmetic uses curve25519-dalek; verified in CI" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow list is a policy, not a mirror of the current dependency tree.
unused-allowed-license = "allow"
# Licences compatible with AGPL-3.0-or-later.
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# No OpenSSL in the default build: TLS goes through rustls.
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "native-tls", use-instead = "rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
