# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Stand-in for `sqlx-sqlite` 0.9.0, the SQLite driver of sqlx, which Tavern
# never builds (the server uses PostgreSQL only). See README.md.
#
# The version must equal the one sqlx requires (`sqlx-sqlite = "=x.y.z"`),
# and the features must be those of the real crate, empty.

[package]
name = "sqlx-sqlite"
version = "0.9.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Never built: frees the `links = \"sqlite3\"` slot for the client's SQLCipher"

[lib]
path = "src/lib.rs"

[features]
_unstable-all-sqlite-features = []
_unstable-all-types = []
_unstable-docs = []
any = []
bigdecimal = []
bundled = []
chrono = []
deserialize = []
json = []
load-extension = []
migrate = []
offline = []
preupdate-hook = []
regexp = []
rust_decimal = []
sqlx-toml = []
time = []
unbundled = []
unlock-notify = []
uuid = []
